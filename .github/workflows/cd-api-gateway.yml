name: CD API Gateway

on:
  workflow_dispatch:
    inputs:
      version_tag:
        type: string
        description: "Tag version (ex: 1.0.0)"
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image name
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER_LOWER/api-gateway" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t ${{ steps.image.outputs.name }}:latest .

      - name: Tag image
        run: |
          docker tag ${{ steps.image.outputs.name }}:latest ${{ steps.image.outputs.name }}:${{ github.event.inputs.version_tag }}
          docker tag ${{ steps.image.outputs.name }}:latest ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Push images
        run: |
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.event.inputs.version_tag }}
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ github.event.inputs.version_tag }} >/dev/null 2>&1; then
            echo "Release ${{ github.event.inputs.version_tag }} already exists, skipping creation"
          else
            gh release create ${{ github.event.inputs.version_tag }} \
              --title "api-gateway ${{ github.event.inputs.version_tag }}" \
              --generate-notes \
              --verify-tag
          fi
