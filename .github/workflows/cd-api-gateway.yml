name: CD API Gateway

on:
  workflow_dispatch:
    inputs:
      version_bump:
        type: choice
        description: "Version bump type"
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

  version:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: services/api-gateway
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      service_tag: ${{ steps.create_tag.outputs.service_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Bump version
        id: bump
        run: |
          RAW_VERSION=$(npm version ${{ github.event.inputs.version_bump }})
          CLEAN_VERSION=$(echo "$RAW_VERSION" | tr -d 'v')
          echo "new_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" > CHANGELOG.md
          else
            git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > CHANGELOG.md
          fi

      - name: Commit changelog and package changes
        run: |
          git add package.json package-lock.json CHANGELOG.md || true
          git commit -m "chore(release): api-gateway v${{ steps.bump.outputs.new_version }}" || echo "No changes to commit"

      - name: Create service tag
        id: create_tag
        run: |
          SERVICE_NAME="api-gateway"
          VERSION="${{ steps.bump.outputs.new_version }}"
          SERVICE_TAG="${SERVICE_NAME}-v${VERSION}"
          git tag -a "$SERVICE_TAG" -m "Release $SERVICE_TAG"
          echo "service_tag=$SERVICE_TAG" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        run: |
          git push origin HEAD
          git push origin --tags

  docker:
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: services/api-gateway

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image name
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER_LOWER/api-gateway" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image with cache
        run: |
          IMAGE=${{ steps.image.outputs.name }}
          docker buildx build \
            --cache-from=type=registry,ref=${IMAGE}:cache \
            --cache-to=type=registry,ref=${IMAGE}:cache,mode=max \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${{ needs.version.outputs.new_version }} \
            -t ${IMAGE}:${{ github.sha }} \
            --push .

  release:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.service_tag }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            if [ -f services/api-gateway/CHANGELOG.md ]; then
              gh release create "$TAG" --title "api-gateway ${TAG}" --notes-file services/api-gateway/CHANGELOG.md --verify-tag
            else
              gh release create "$TAG" --title "api-gateway ${TAG}" --generate-notes --verify-tag
            fi
          fi
