name: CI Product Service

on:
  push:
    branches: [main]
    paths:
      - "services/product/**"

  pull_request:
    branches: [main]
    paths:
      - "services/product/**"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/product

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  security:
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: services/product

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  build:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    defaults:
      run:
        working-directory: services/product

    steps:
      - uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t product-service .

      - name: Test container runs
        run: docker run --rm product-service node -v
