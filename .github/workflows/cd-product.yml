name: CD Product Service

on:
  workflow_dispatch:
    inputs:
      version_bump:
        type: choice
        description: "Version bump type"
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  version:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: services/product

    permissions:
      contents: write
    
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Bump version
        id: bump
        run: |
          RAW_VERSION=$(npm version ${{ github.event.inputs.version_bump }})
          CLEAN_VERSION=$(echo "$RAW_VERSION" | tr -d 'v')
          echo "new_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push origin HEAD
          git push origin --tags

  docker:
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: services/product

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image name
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER_LOWER/product-service" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t ${{ steps.image.outputs.name }}:latest .

      - name: Tag image
        run: |
          docker tag ${{ steps.image.outputs.name }}:latest ${{ steps.image.outputs.name }}:${{ needs.version.outputs.new_version }}
          docker tag ${{ steps.image.outputs.name }}:latest ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Push images
        run: |
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ needs.version.outputs.new_version }}
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: [docker, version]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ needs.version.outputs.new_version }} \
            --title "product-service ${{ needs.version.outputs.new_version }}" \
            --generate-notes
